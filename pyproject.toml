[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animation-studio"
version = "0.1.0"
description = "AI animation studio: story and asset import, animatic pipeline"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/animation_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
